<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade-in Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .heading-font {
            font-family: 'Poppins', system_ui, sans-serif;
        }

        .device-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .device-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .price {
            font-variant-numeric: tabular-nums;
        }

        .color-chip {
            width: 22px;
            height: 22px;
            border-radius: 9999px;
            border: 2px solid #27272a;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .color-chip:hover { transform: scale(1.1); border-color: #52525b; }
        .color-chip.selected { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <div class="max-w-3xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center gap-x-3 mb-8">
            <div class="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-sync text-white text-3xl"></i>
            </div>
            <div>
                <h1 class="text-4xl font-semibold heading-font tracking-tight">Trade-in Estimator</h1>
                <p class="text-zinc-400">Get instant trade-in value & upgrade options</p>
            </div>
        </div>

        <!-- Old Device Form -->
        <div class="bg-zinc-900 rounded-3xl p-8 border border-zinc-800">
            <div class="font-semibold text-xl mb-6 flex items-center gap-x-2">
                <i class="fa-solid fa-mobile-screen-button text-emerald-400"></i>
                <span>Your Current Device</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Brand -->
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1.5">Brand</label>
                    <select id="brand" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-lg focus:outline-none focus:border-emerald-400">
                        <option value="">Select brand</option>
                    </select>
                </div>

                <!-- Model -->
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1.5">Model</label>
                    <select id="model" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-lg focus:outline-none focus:border-emerald-400" disabled>
                        <option value="">Select model</option>
                    </select>
                </div>

                <!-- Storage -->
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1.5">Storage</label>
                    <select id="storage" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-lg focus:outline-none focus:border-emerald-400" disabled>
                        <option value="">Select storage</option>
                    </select>
                </div>
            </div>

            <!-- Trade-in Price Display -->
            <div id="trade-in-section" class="hidden mt-8 pt-8 border-t border-zinc-800">
                <div class="flex justify-between items-baseline">
                    <div>
                        <div class="text-zinc-400 text-sm">Your trade-in value (HK/Macau)</div>
                        <div id="trade-in-price" class="text-6xl font-semibold text-emerald-400 price mt-1">$0</div>
                    </div>
                    <div class="text-right">
                        <div class="px-4 py-1.5 bg-zinc-950 text-emerald-400 text-sm rounded-2xl border border-emerald-900 flex items-center gap-x-2 w-fit ml-auto">
                            <i class="fa-solid fa-check"></i>
                            <span class="font-medium">Instant quote</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- New Phone Recommendations -->
        <div id="recommendations-section" class="hidden mt-8">
            <div class="font-semibold text-xl mb-4 px-1 flex items-center gap-x-2">
                <i class="fa-solid fa-magic text-violet-400"></i>
                <span>Recommended Upgrades</span>
            </div>
            <p class="text-sm text-zinc-500 px-1 mb-4">Drive toward these 3 flagship models • Price after trade-in credit</p>
            
            <div id="recommendations" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
        // Embedded device data (from Google Sheet - all HK/Macau phones, no location field)
        const devices = [
            {"brand":"Samsung","model":"Galaxy Z Flip6","storage":"512GB","trade_in_price":3800},
            {"brand":"Samsung","model":"Galaxy Z Flip5","storage":"512GB","trade_in_price":1800},
            {"brand":"Samsung","model":"Galaxy Z Flip4","storage":"512GB","trade_in_price":1100},
            {"brand":"Samsung","model":"Galaxy Z Fold6","storage":"1TB","trade_in_price":7700},
            {"brand":"Samsung","model":"Galaxy Z Fold5","storage":"1TB","trade_in_price":3300},
            {"brand":"Samsung","model":"Galaxy Z Fold4","storage":"1TB","trade_in_price":2100},
            {"brand":"Samsung","model":"Galaxy S23","storage":"512GB","trade_in_price":1900},
            {"brand":"Samsung","model":"Galaxy S24","storage":"512GB","trade_in_price":2800},
            {"brand":"Samsung","model":"Galaxy S23+","storage":"512GB","trade_in_price":2100},
            {"brand":"Samsung","model":"Galaxy S24+","storage":"512GB","trade_in_price":3300},
            {"brand":"Samsung","model":"Galaxy S23 Ultra","storage":"1TB","trade_in_price":4400},
            {"brand":"Samsung","model":"Galaxy S24 Ultra","storage":"1TB","trade_in_price":5900},
            {"brand":"Apple","model":"iPhone 16 Pro","storage":"1TB","trade_in_price":6600},
            {"brand":"Apple","model":"iPhone 15 Pro","storage":"1TB","trade_in_price":4400},
            {"brand":"Apple","model":"iPhone 14 Pro","storage":"1TB","trade_in_price":3000},
            {"brand":"Apple","model":"iPhone 14 Pro Max","storage":"1TB","trade_in_price":3700},
            {"brand":"Apple","model":"iPhone 15 Pro Max","storage":"1TB","trade_in_price":5300},
            {"brand":"Apple","model":"iPhone 16 Pro Max","storage":"1TB","trade_in_price":7300}
        ];

        // Recommended new phones (prices fetched via shop.samsung.com SKU method, HKD promo where available)
        const recommendedPhones = {
            "Galaxy S26 Ultra": {
                link: "https://www.samsung.com/hk/smartphones/galaxy-s26-ultra/buy/",
                storages: [
                    { size: "256GB", price: 9998, sku: "SM-S9480ZKITGY" },
                    { size: "512GB", price: 10998, sku: "SM-S9480ZSOTGY" },
                    { size: "1TB", price: 13798, sku: "SM-S9480ZSPTGY" }
                ],
                colors: ["#1a1a1a", "#c0c0c0", "#2a2a6e", "#8b0000"]
            },
            "Galaxy Z Fold7": {
                link: "https://www.samsung.com/hk/smartphones/galaxy-z-fold7/buy/",
                storages: [
                    { size: "256GB", price: 15198, sku: "SM-F9660DBDTGY" },
                    { size: "512GB", price: 15998, sku: "SM-F9660DBGTGY" }
                ],
                colors: ["#1a1a1a", "#c0c0c0", "#2a2a6e"]
            },
            "Galaxy Z Flip7": {
                link: "https://www.samsung.com/hk/smartphones/galaxy-z-flip7/buy/",
                storages: [
                    { size: "256GB", price: 7998, sku: "SM-F7660DBATGY" }
                ],
                colors: ["#1a1a1a", "#c0c0c0", "#8b0000"]
            }
        };

        // DOM Elements
        const brandSelect = document.getElementById('brand');
        const modelSelect = document.getElementById('model');
        const storageSelect = document.getElementById('storage');
        const tradeInSection = document.getElementById('trade-in-section');
        const tradeInPriceEl = document.getElementById('trade-in-price');
        const recommendationsSection = document.getElementById('recommendations-section');
        const recommendationsContainer = document.getElementById('recommendations');

        let currentTradeInValue = 0;
        let selectedNewPhone = null;

        // Populate Brand dropdown
        function populateBrands() {
            const brands = [...new Set(devices.map(d => d.brand))];
            brands.forEach(brand => {
                const opt = document.createElement('option');
                opt.value = brand;
                opt.textContent = brand;
                brandSelect.appendChild(opt);
            });
        }

        // Populate Model dropdown based on selected brand
        function populateModels(brand) {
            modelSelect.innerHTML = '<option value="">Select model</option>';
            modelSelect.disabled = false;
            
            const models = [...new Set(devices.filter(d => d.brand === brand).map(d => d.model))];
            models.forEach(model => {
                const opt = document.createElement('option');
                opt.value = model;
                opt.textContent = model;
                modelSelect.appendChild(opt);
            });
        }

        // Populate Storage when model changes
        function populateStorage() {
            const brand = brandSelect.value;
            const model = modelSelect.value;
            
            if (!brand || !model) return;

            storageSelect.innerHTML = '<option value="">Select storage</option>';
            storageSelect.disabled = false;
            
            const storages = [...new Set(devices
                .filter(d => d.brand === brand && d.model === model)
                .map(d => d.storage))];
            
            storages.forEach(storage => {
                const opt = document.createElement('option');
                opt.value = storage;
                opt.textContent = storage;
                storageSelect.appendChild(opt);
            });
        }

        // Calculate and show trade-in price
        function calculateTradeIn() {
            const brand = brandSelect.value;
            const model = modelSelect.value;
            const storage = storageSelect.value;

            if (!brand || !model || !storage) {
                tradeInSection.classList.add('hidden');
                recommendationsSection.classList.add('hidden');
                return;
            }

            const match = devices.find(d => 
                d.brand === brand &&
                d.model === model &&
                d.storage === storage
            );

            if (match) {
                currentTradeInValue = match.trade_in_price;
                tradeInPriceEl.textContent = '$' + currentTradeInValue;
                tradeInSection.classList.remove('hidden');
                showRecommendations(brand);
            } else {
                tradeInSection.classList.add('hidden');
                recommendationsSection.classList.add('hidden');
            }
        }

        // Show 3 recommended new models with color chips + "You pay" calculation
        function showRecommendations(oldBrand) {
            recommendationsContainer.innerHTML = '';
            
            const models = Object.keys(recommendedPhones);
            
            models.forEach(modelName => {
                const modelData = recommendedPhones[modelName];
                
                const card = document.createElement('div');
                card.className = `device-card bg-zinc-900 border border-zinc-800 rounded-3xl p-6 flex flex-col`;
                
                let storageHtml = '';
                modelData.storages.forEach((s, idx) => {
                    const youPay = s.price - currentTradeInValue;
                    storageHtml += `
                        <div class="flex justify-between items-center text-sm py-1.5 border-b border-zinc-800 last:border-0">
                            <span class="text-zinc-400">${s.size}</span>
                            <div class="text-right">
                                <div class="text-emerald-400 font-medium">−$${currentTradeInValue}</div>
                                <div class="font-semibold text-white">HK$${youPay}</div>
                            </div>
                        </div>
                    `;
                });

                let colorHtml = '';
                modelData.colors.forEach((color, idx) => {
                    colorHtml += `<div class="color-chip" style="background-color: ${color}" data-color="${color}"></div>`;
                });

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <span class="px-3 py-1 text-xs rounded-2xl bg-violet-900/60 text-violet-300">Recommended</span>
                        </div>
                        <a href="${modelData.link}" target="_blank" class="text-xs text-zinc-400 hover:text-white transition-colors">
                            <i class="fa-solid fa-external-link-alt"></i>
                        </a>
                    </div>
                    
                    <div>
                        <div class="font-semibold text-xl">${modelName}</div>
                    </div>

                    <div class="mt-3 flex gap-1.5">
                        ${colorHtml}
                    </div>

                    <div class="mt-auto pt-5">
                        <div class="text-xs text-zinc-500 mb-2">Storage / You pay after trade-in</div>
                        <div class="space-y-px">
                            ${storageHtml}
                        </div>
                    </div>
                `;
                
                recommendationsContainer.appendChild(card);
            });
            
            recommendationsSection.classList.remove('hidden');
        }

        // Event Listeners
        brandSelect.addEventListener('change', () => {
            const brand = brandSelect.value;
            if (brand) {
                populateModels(brand);
                modelSelect.disabled = false;
                storageSelect.disabled = true;
                storageSelect.innerHTML = '<option value="">Select storage</option>';
                tradeInSection.classList.add('hidden');
                recommendationsSection.classList.add('hidden');
            }
        });

        modelSelect.addEventListener('change', () => {
            populateStorage();
            tradeInSection.classList.add('hidden');
            recommendationsSection.classList.add('hidden');
        });

        storageSelect.addEventListener('change', calculateTradeIn);

        // Initialize
        function init() {
            populateBrands();
            
            // Auto-select Samsung for demo
            setTimeout(() => {
                brandSelect.value = 'Samsung';
                const event = new Event('change');
                brandSelect.dispatchEvent(event);
                
                setTimeout(() => {
                    modelSelect.value = 'Galaxy S24 Ultra';
                    const modelEvent = new Event('change');
                    modelSelect.dispatchEvent(modelEvent);
                    
                    setTimeout(() => {
                        storageSelect.value = '1TB';
                        calculateTradeIn();
                    }, 120);
                }, 120);
            }, 400);
        }

        init();
    </script>
</body>
</html>
